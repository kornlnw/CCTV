services:
  postgres:
    image: postgres:16-alpine
    container_name: cctv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cctv_shop
    ports:
      - "5434:5432"
    volumes:
      - cctv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cctv_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cctv_pgdata:
