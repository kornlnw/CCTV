services:
  postgres:
    image: postgres:16-alpine
    container_name: cctv_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-cctv_shop}
    volumes:
      - cctv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cctv_shop}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cctv_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cctv_shop}?schema=public
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal, web]

  blog-build:
    build:
      context: ./apps/blog
      dockerfile: Dockerfile
    container_name: cctv_blog_build
    volumes:
      - blog_dist:/output
    restart: "no"
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    container_name: cctv_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - blog_dist:/srv/blog-dist:ro
    depends_on:
      app:
        condition: service_started
      blog-build:
        condition: service_completed_successfully
    networks: [web]

networks:
  internal:
  web:

volumes:
  cctv_pgdata:
  caddy_data:
  caddy_config:
  blog_dist:
